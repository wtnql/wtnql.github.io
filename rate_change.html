<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>谱面倍速工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 2;

    }
    hr {
      
    }
    button{
      display: block;
      width: 200px;
      height: 40px;
      margin: 20px auto;
      padding: 5px 15px;
      font-size: 16px;
    }
    input[type="file"] {
      margin: 10px 0 5px 0;
      font-size: 16px;
    }
    input[type="text"] {
      font-size: 16px;
      padding: 5px 5px;
    }
    input[type="number"] {
      font-size: 16px;
      padding: 5px 5px;
    }
    select{
      font-size: 16px;
      margin: 0 10px 0 0;
      padding: 5px 5px;

    }
    textarea {
      font-size: 14px;
      line-height: 1.2;
      width: 550px;
      margin: 5px 0 0 0;
      height: 150px;
    }
    .button-like {
      display: block;
      width: 200px;
      height: 40px;
      margin: 10px auto;
      padding: 5px 15px;
      font-size: 16px;
      /* 浏览器默认按钮样式（包括背景色、边框等） */
      background-color: buttonface;
      border: 1px solid #767676;
      border-radius: 2px;
      
      text-align: center;
      text-decoration: none;
      color: buttontext;
    }
    .button-like:hover {
      background-color: #e6e6e6;
      border-color: #4d4d4d;
    }
  </style>

</head>
<body>
  <h2 style="text-align: center;">谱面倍速工具，支持.osu（2026.8.18.1）</h2>
  <hr />
  <p>1.从别处获取倍速后音乐（仅使用文件名）; 2.此工具生成.osu倍速后谱面文件; 3.共同放入谱面目录。<br>（因.mc格式可直接在malody中改bpm和偏移故不提供）</p>

  <div>
    <input type="file" id="inputMusic" accept=".ogg,.mp3" onchange="chooseMusic()" style="display: none;">
    <label for="inputMusic" class="button-like">选择音乐文件</label>
  </div>
  
  <div>
    <input type="file" id="input" accept=".osu" onchange="chooseFile()" style="display: none;">
    <label for="input" class="button-like">选择谱面文件</label>
  </div>
  <textarea style="display:block; margin: 0 auto; width: 750px;" id="fileText" cols="100" rows="50" readonly></textarea>
  <p id="m0" style="white-space: pre-line;"></p>
  <p id="a0" style="white-space: pre-line;"></p>

  <div id="plane1" style="display:none">
    <hr style="margin:10px 0 10px 0" />
    <text>音乐文件：</text><input type="text" id="newMusic" placeholder="请输入内容" size="50"><br>
    <text>新version：</text><input type="text" id="newVersion" placeholder="请输入内容" size="50"><br>
    <text>新倍速：</text><input type="number" id="newRate" step="0.01" value="0" placeholder="支持两位小数" oninput="validateAndFixRate(this)">
    <div >
      <button onclick="create()">生成并下载</button>
    </div>
  </div>

  <p id="a1"></p>

<!-- 111 -->
<script>
  const inputMusic = document.getElementById('inputMusic');
  const m0 = document.getElementById('m0');
  const input = document.getElementById('input');
  const a0 = document.getElementById('a0');
  const plane1 = document.getElementById('plane1');
  const newMusic = document.getElementById('newMusic');
  const newVersion = document.getElementById('newVersion');
  const newRate = document.getElementById('newRate');
  const a1 = document.getElementById('a1');

  let reader;
  let ext = "";
  let baseName = "";
  let baseMusic = "";

//osu文件读取结果
  let audioFilename = "";
  let previewTime = "";
  let version = "";
  let timingPoints = [];
  let hitObjects = []; 

//下载是否合法
  let allowDownload = false;
  let downloadString = "";


//使输入合法
function validateAndFixRate(input) {
    a1.innerHTML = "";
    allowDownload = false;
    const val = parseFloat(input.value);
    // 检查是否为有效数字
    if (isNaN(val)) {
        a1.innerHTML = "倍速输入错误";
        return;
    }
    // 检查是否大于0
    if (val <= 0) {
        a1.innerHTML = "倍速输入错误";
        return;
    }
    // 合法：强制保留两位小数，并更新输入框显示
    const fixedVal = Math.round(val * 100) / 100; // 四舍五入到两位小数
    // 注意：toFixed(2) 会返回字符串，可能导致额外舍入，但结合 step=0.01 可控
    // input.value = fixedVal.toFixed(2);
    updateVer(fixedVal.toFixed(2));
    allowDownload = true;
    return;
}

//根据倍速值调整
function updateVer(value){
  // 将输入值转为数字
  const num = parseFloat(value);
  // 如果 ≤0，直接返回（不更新版本号）
  if (num <= 0) return;

  var preString = "";
  downloadString = "";
  // 如果数值不等于 1，才添加前缀
    if (num !== 1) {
        // 利用 parseFloat 自动去除末尾多余的 0（如 1.10 → 1.1）
        const cleanedStr = num.toString(); // 例如 1.10 → "1.1"，2.00 → "2"
        preString = "[x" + cleanedStr + "] ";
        downloadString = "-[x" + cleanedStr + "]";
    }

  newVersion.value = preString + version;
}
  function chooseMusic(){
    baseMusic = "";
    const file = inputMusic.files[0];
    m0.innerHTML = '';
    //选择文件判断
    if (!file) {
      m0.innerHTML = "";
      return;
    }

    // 获取文件名并显示
    baseMusic = file.name;
    m0.innerHTML = "音乐文件：" + baseMusic;
    newMusic.value = baseMusic;

  }

  function chooseFile(){

    const file = input.files[0];
    document.getElementById('fileText').value = "";
    document.getElementById('plane1').style.display = 'none';
    a0.innerHTML = '';

    
    //选择文件判断
    if (!file) {
      a0.innerHTML = "";
      return;
    }

    reader = new FileReader();
    // 获取文件名，并提取扩展名（转为小写便于比较）
    const fileName = file.name;
    a0.innerHTML = fileName;
    ext = fileName.substring(fileName.lastIndexOf('.')).toLowerCase();
    baseName = fileName.substring(0, fileName.lastIndexOf('.'));
    // 后缀名判断
    if(ext == ".osu"){
      
    }
    else if(ext == ".mc"){
      
    }
    else{
      a0.innerHTML += "\n"+ "不支持的文件类型";
      return;
    }

    reader.onload = function () {
      document.getElementById('fileText').value = reader.result;

      if(ext == ".osu"){
        readOsu(reader.result);
      }

    }
    reader.readAsText(file, "UTF-8");
  }
  //TextArea初始滚动
  function scrollToLine(textarea, lineNumber) {

    let lineHeight = 14*1.2;
    
    // 滚动到目标行（行号从 1 开始）
    const scrollPosition = (lineNumber - 1) * lineHeight;
    textarea.scrollTop = scrollPosition;
  }

  function readOsu(content){
    const lines = content.split(/\r?\n/); // 按换行符分割，兼容 \n 和 \r\n
    let inTimingPoints = false;
    let inHitObjects = false;
    let inMetadata = false;
    let inGeneral = false;
    //存储物件
    hitObjects.length = 0;
    timingPoints.length = 0;
    audioFilename = "";
    previewTime = "";
    version = "";


    for (let i = 0; i < lines.length; i++){
      var line = lines[i];
      if (line.startsWith('[') && line.endsWith(']')) {
        inGeneral = false;
        inMetadata = false;
        inTimingPoints = false;
        inHitObjects = false;
        if (line == '[General]') inGeneral = true;
        else if (line == '[Metadata]') inMetadata = true;
        else if (line == '[TimingPoints]') inTimingPoints = true;
        else if (line == '[HitObjects]') inHitObjects = true;
        continue;
      }
      //收集General中AudioFilename、PreviewTime（这两个有空格）
      if(inGeneral && line.includes(':')){
        const colonIndex = line.indexOf(':');
        const key = line.substring(0, colonIndex).trim();
        if (key == 'AudioFilename') {
          const value = line.substring(colonIndex + 1).trim();
          audioFilename = value;
        }
        else if(key == 'PreviewTime') {
          const value = line.substring(colonIndex + 1).trim();
          previewTime = value;
        }
      }

      //收集Metadata中Version
      if(inMetadata && line.includes(':')){
        const colonIndex = line.indexOf(':');
        const key = line.substring(0, colonIndex).trim();
        if (key == 'Version') {
          const value = line.substring(colonIndex + 1).trim();
          version = value;
        }
      }


      //收集TimingPoints非空行
      if(inTimingPoints){
        const trimmed = line.trim();
          if (trimmed != '') {
            timingPoints.push(line);  // 保留原始行内容（不含换行符）
        }
      }

      //收集HitObjects非空行
      if(inHitObjects){
        const trimmed = line.trim();
          if (trimmed != '') {
            hitObjects.push(line);  // 保留原始行内容（不含换行符）
        }
      }
    }
    a0.innerHTML += "\n"+ "version："+version
    plane1.style.display = 'block';
    newVersion.value = version;
    newRate.value = 1.00;
    a1.innerHTML = "";
    
  }
  //执行文本生成
  function create(){
    a1.innerHTML = "";
    if(ext == ".osu"){
      if(!allowDownload){
        return;
      }
      const rate = parseFloat(newRate.value);
      const fixedVal = Math.round(rate * 100) / 100; // 四舍五入到两位小数

      a1.innerHTML = "使用倍速"+ fixedVal.toFixed(2).toString() +"生成";

      const newPreviewTime = Math.floor(parseInt(previewTime, 10) / fixedVal).toString();
      var newTimingPoints = updateOsuTiming(fixedVal);
      var newHitObjects = updateOsuHit(fixedVal);

      var newContent = connectOsu(reader.result,newPreviewTime,newMusic.value,newVersion.value,newTimingPoints,newHitObjects);
      download(newContent);
    }
    
    else{
      a1.innerHTML="后缀错误";
      return;
    }
  }

  //osu格式TimingPoints改变
  function updateOsuTiming(rate){
    var newTimingPoints = [];

    // 遍历每一个原物件
    for (let obj of timingPoints){
      const parts = obj.split(',');

      // 1. 时间字段：除以 rate 并向下取整
      const timeVal = parseFloat(parts[0]);
      const newTime = Math.floor(timeVal / rate);
      parts[0] = newTime.toString();

      // 2. 拍长字段：如果 >0 则除以 rate，保留15位有效数字，去除末尾零
      const bpmStr = parts[1];
      const bpmVal = parseFloat(bpmStr);
      if (bpmVal > 0) {
          const newBpm = bpmVal / rate;
          // 保留15位有效数字
          let formatted = newBpm.toPrecision(15);
          // 去除末尾多余的零（以及可能的小数点）
          formatted = formatted.replace(/\.?0+$/, '');
          parts[1] = formatted;
      }

      newTimingPoints.push(parts.join(','));

    }

    return newTimingPoints;
  }

    //osu格式HitObjects改变
  function updateOsuHit(rate){
    var newHitObjects = [];

    // 遍历每一个原物件
    for (let obj of hitObjects){
      // 解析时间（第三个数字）
      // 按逗号分割全部字段
      const parts = obj.split(',');
      //长条处理
      const type = parseInt(parts[3]);
      if(type == 128){
        const extra = parts[5];
        const extraParts = extra.split(':');
        // 替换
        const x0 = parseInt(extraParts[0]);
        const newX0 = Math.floor(x0 / rate);
        extraParts[0] = newX0.toString();
        parts[5] = extraParts.join(':');
      }
      else{

      }
      const x = parseInt(parts[2]);
      const newX = Math.floor(x / rate);
      // 替换
      parts[2] = newX.toString();

      //获取新obj
      let newObj;
      newObj = parts.join(',');
      newHitObjects.push(newObj);

    }

    return newHitObjects;
  }

  //osu拼接文本
  function connectOsu(content,newPreviewTime,newMusic,newVersion,newTimingPoints,newHitObjects){
    const lines = content.split(/\r?\n/); // 按换行符分割，兼容 \n 和 \r\n
    let inHitObjects = false;
    let inTimingPoints = false;
    let inMetadata = false;
    let inGeneral = false;
    const result = [];

    for (let i = 0; i < lines.length; i++){
      let line = lines[i];
      //检测节头
      if (line.startsWith('[') && line.endsWith(']')) {
        inMetadata = false;
        inTimingPoints = false;
        inHitObjects = false;
        inGeneral = false;
        if (line == '[General]'){
          inGeneral = true;
        }
        if (line == '[Metadata]'){
          inMetadata = true;
        } 
        else if (line == '[TimingPoints]'){
          //一口气跳过并添加
          result.push(line);
          result.push(...newTimingPoints);
          result.push("");
          result.push("");
          while (i + 1 < lines.length && !(lines[i + 1].startsWith('[') && lines[i + 1].endsWith(']'))) {
            i++;
                }
          continue;
        } 
        else if (line == '[HitObjects]'){
          //一口气跳过并添加
          result.push(line);
          result.push(...newHitObjects);
          result.push("");
          while (i + 1 < lines.length && !(lines[i + 1].startsWith('[') && lines[i + 1].endsWith(']'))) {
            i++;
                }
          continue;
        } 
        
      }
      //特定行修改
      else if(inGeneral && line.startsWith('AudioFilename:')){
        line = `AudioFilename: ${newMusic}`;
      }
      else if(inGeneral && line.startsWith('PreviewTime:')){
        line = `PreviewTime: ${newPreviewTime}`;
      }
      else if(inMetadata && line.startsWith('Version:')){
        line = `Version:${newVersion}`;
      }
      else if(inMetadata && line.startsWith('BeatmapID:')){
        line = "BeatmapID:0";
      }
      else if(inMetadata && line.startsWith('BeatmapSetID:')){
        line = "BeatmapSetID:-1";
      }
      result.push(line);
      
    }
    return result.join('\r\n');

  }



  function download(content){
    //const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const blob = new Blob([content], { type: 'application/octet-stream' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = baseName + downloadString + "-[wtnql.github.io]" + ext;
    link.click();
    URL.revokeObjectURL(link.href);
  }


</script>

</body>
</html>
